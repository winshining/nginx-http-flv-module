worker_processes 1;
error_log stderr warn;
events { worker_connections 128; }

rtmp {
    server {
        listen 127.0.0.1:1935;
        application ingest {
            live on;
            notify_method get;
            on_publish http://127.0.0.1:8080/authorize;
            recorder audio {
                record audio manual;
                record_path /captures;
                record_keyed on;
                record_append on;
                record_lock on;
            }
        }
    }
}

http {
    access_log off;
    map $arg_name $record_key {
        default '';
        reconnect session-A;
        damaged broken;
    }
    server {
        listen 127.0.0.1:8080;
        absolute_redirect off;
        location = /authorize {
            add_header X-Record-Key $record_key always;
            return 302 source;
        }
        location /control { rtmp_control record; }
        location = /stats { rtmp_stat all; }
    }
}
